<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#082a33">
<title>上岸 Tide Echo — Leido</title>
<meta name="description" content="上岸：第一人称海岛生活游戏。七天义工，第七天决定去留。">
<style>
@font-face { font-family: 'Instrument Serif'; font-style: italic; src: url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); font-display: swap; }

:root {
  --sea: #1f7a8c;
  --deep: #0f4c5c;
  --abyss: #082a33;
  --sand: #f4e4c6;
  --ink: #0f2f36;
  --sun: #ffd27a;
  --sans: 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  --script: 'Instrument Serif', Georgia, serif;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; background: var(--abyss); }
body { background: var(--sand); color: var(--ink); font-family: var(--sans); overflow-x: clip; }
a { color: inherit; text-decoration: none; }
img { display: block; width: 100%; height: 100%; object-fit: cover; }
:focus-visible { outline: 3px solid var(--sun); outline-offset: 4px; }

.global-nav { position: absolute; z-index: 5; inset: 0 0 auto; display: flex; flex-wrap: wrap; align-items: center; gap: 10px 24px; padding: 26px 5.5%; font-size: 12px; color: #fff; text-shadow: 0 1px 8px #082a33aa; }
.global-nav a:first-child { font-size: 25px; margin-right: auto; }
.global-nav a:hover { color: var(--sun); }

/* Every picture is a frame; the caption is a word or two. */
.frame { position: relative; overflow: hidden; background: var(--abyss); }
.frame figcaption { position: absolute; left: 5.5%; bottom: 28px; color: #fff; font-size: 13px; letter-spacing: 3px; text-shadow: 0 1px 10px #000a; }
.frame figcaption b { display: block; font-size: clamp(26px, 3.2vw, 44px); letter-spacing: 0; font-weight: 900; margin-top: 2px; }
.frame img { transform: scale(1.04); transition: transform 1.6s cubic-bezier(.16,1,.3,1); }
.frame.seen img { transform: scale(1); }

.full { height: 100svh; }
.wide { aspect-ratio: 21 / 9; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; background: var(--abyss); }
.pair .frame { aspect-ratio: 4 / 3; }
.stack { background: var(--abyss); }
.stack > * + * { margin-top: 6px; }

.hero h1 { position: absolute; left: 5.5%; bottom: 46px; color: #fff; font-size: clamp(90px, 15vw, 220px); line-height: .9; font-weight: 900; letter-spacing: -.02em; text-shadow: 0 6px 40px #082a3366; }
.hero h1 em { display: block; font-family: var(--script); font-weight: 400; font-size: .25em; color: var(--sun); margin: 10px 0 0 .1em; letter-spacing: 0; }
.hero::after { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, #082a33cc, transparent 45%); pointer-events: none; }
.hero h1 { z-index: 2; }

.line { padding: 16vh 5.5%; text-align: center; font-size: clamp(26px, 3.4vw, 46px); font-weight: 900; line-height: 1.4; }
.line em { font-family: var(--script); font-weight: 400; color: var(--sea); }
.line.dark { background: var(--abyss); color: #fff; }
.line.dark em { color: var(--sun); }
.line small { display: block; margin-top: 14px; font-size: 12px; letter-spacing: 3px; font-weight: 400; opacity: .6; }

.waterline { height: 40px; background: var(--sand); position: relative; }
.waterline::after { content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 20px; background: repeating-radial-gradient(circle at 20px 26px, var(--abyss) 0 19px, transparent 20px 40px); background-size: 40px 20px; }

.depth { position: absolute; right: 5.5%; bottom: 28px; color: var(--sun); font-size: 13px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 1px 10px #000a; }

/* Mechanics: four words and one toy */
.verbs { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--sand); }
.verbs div { padding: 60px 20px; text-align: center; border-right: 1px solid #0f2f3622; font-size: clamp(28px, 3vw, 42px); font-weight: 900; }
.verbs div:last-child { border-right: 0; }
.verbs small { display: block; font-size: 11px; letter-spacing: 3px; font-weight: 400; color: var(--sea); margin-top: 6px; }

.reel { display: grid; grid-template-columns: 1fr 1.2fr; align-items: center; gap: 40px; padding: 70px 5.5%; background: var(--deep); color: #e8f6f1; }
.reel h2 { font-size: clamp(32px, 4vw, 54px); font-weight: 900; }
.reel h2 small { display: block; font-size: 12px; letter-spacing: 3px; font-weight: 400; color: var(--sun); margin-bottom: 8px; }
.reel-stage { display: grid; gap: 16px; }
.water { position: relative; height: 110px; border-radius: 16px; background: repeating-linear-gradient(90deg, #ffffff10 0 2px, transparent 2px 40px), linear-gradient(180deg, #ffffff18, #ffffff05); overflow: hidden; }
.bobber { position: absolute; top: 30px; left: calc(var(--line-left, 85) * 1%); width: 18px; height: 28px; border-radius: 50% 50% 40% 40%; background: linear-gradient(180deg, #ff7a59 0 50%, #fff 50%); transform: translateX(-50%) translateY(var(--bob, 0px)); transition: left .1s linear; }
.fish { position: absolute; top: 70px; left: calc(var(--line-left, 85) * 1%); width: 34px; height: 14px; border-radius: 50%; background: #082a33aa; transform: translateX(-20%); transition: left .1s linear; }
.fish::after { content: ''; position: absolute; right: -10px; top: 1px; border: 6px solid transparent; border-left: 10px solid #082a33aa; }
.bar { position: relative; height: 14px; border-radius: 99px; background: #ffffff1c; overflow: hidden; }
.bar .zone { position: absolute; top: 0; bottom: 0; left: 25%; width: 50%; background: #9fe0a133; border-inline: 2px solid #9fe0a199; }
.bar .fill { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 99px; background: #9fe0a1; }
.bar .fill.warn { background: var(--sun); }
.bar .fill.danger { background: #ff7a59; }
.line-bar .fill { background: #e8f6f1; }
.reel-controls { display: flex; gap: 12px; align-items: center; }
.reel-btn { appearance: none; border: 0; border-radius: 99px; padding: 14px 26px; font: 700 15px var(--sans); background: var(--sun); color: var(--ink); cursor: pointer; touch-action: none; user-select: none; -webkit-user-select: none; box-shadow: 0 6px 0 #c99a3e; transition: transform .08s, box-shadow .08s; }
.reel-btn.held, .reel-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #c99a3e; }
.reel-btn.secondary { background: transparent; color: #e8f6f1; border: 1px solid #e8f6f155; box-shadow: none; }
.reel-status { min-height: 1.6em; font-weight: 700; color: var(--sun); font-size: 14px; }

.endings { display: grid; grid-template-columns: repeat(3, 1fr); }
.endings div { padding: 70px 20px; text-align: center; font-size: clamp(28px, 3vw, 42px); font-weight: 900; }
.endings div:nth-child(1) { background: #ffb08a; }
.endings div:nth-child(2) { background: #a9dcd8; }
.endings div:nth-child(3) { background: #c9cfe6; }
.endings small { display: block; font-family: var(--script); font-style: italic; font-weight: 400; font-size: 18px; margin-bottom: 4px; }

footer { display: flex; justify-content: space-between; align-items: end; gap: 20px; padding: 40px 5.5%; background: var(--abyss); color: var(--sand); font-size: 12px; }
footer p { font-size: 10px; opacity: .5; max-width: 520px; text-align: right; }
footer a:hover { color: var(--sun); }

@media (max-width: 760px) {
  .global-nav a:first-child { flex-basis: 100%; }
  .global-nav { gap: 6px 16px; }
  .full { height: 80svh; }
  .wide { aspect-ratio: 4 / 3; }
  .pair { grid-template-columns: 1fr; }
  .verbs, .endings { grid-template-columns: 1fr 1fr; }
  .verbs div { padding: 36px 10px; border-bottom: 1px solid #0f2f3622; }
  .endings div:nth-child(3) { grid-column: 1 / -1; }
  .reel { grid-template-columns: 1fr; padding: 50px 5.5%; }
  footer { flex-direction: column; align-items: start; }
  footer p { text-align: left; }
}
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  *, *::before, *::after { animation: none !important; transition: none !important; }
  .frame img { transform: none; }
}
</style>
</head>

<main>
  <figure class="frame full hero">
    <img src="/games/tide-echo/aerial-island.jpg" alt="从空中俯瞰的海岛、沙滩海湾与青绿色浅海" fetchpriority="high">
    <h1>上岸<em>Tide Echo</em></h1>
  </figure>

  <p class="line">到桂山岛做七天义工。<br>第七天，<em>决定去留。</em><small>第一人称海岛生活 · UNITY 6</small></p>

  <figure class="frame full"><img src="/games/tide-echo/title-beach.jpg" alt="沙滩上的高脚木屋、倒扣的小船和伸向海里的栈桥" loading="lazy"><figcaption>DAY 1<b>抵达</b></figcaption></figure>

  <div class="stack">
    <figure class="frame wide"><img src="/games/tide-echo/bay-pier.jpg" alt="海湾全景：栈桥、渔船、沙滩村落与山腰住区" loading="lazy"><figcaption>THE BAY<b>海湾与村落</b></figcaption></figure>
    <div class="pair">
      <figure class="frame"><img src="/games/tide-echo/hillside.jpg" alt="山腰上层层排开的住区" loading="lazy"><figcaption>HILLSIDE<b>山腰住区</b></figcaption></figure>
      <figure class="frame"><img src="/games/tide-echo/coast-road.jpg" alt="沿海岸山壁的环岛公路与浅海礁石" loading="lazy"><figcaption>RING ROAD<b>环岛公路</b></figcaption></figure>
    </div>
    <figure class="frame wide"><img src="/games/tide-echo/road-level.jpg" alt="第一人称视角的环岛公路，右侧是护栏与大海" loading="lazy"><figcaption>RIDE<b>骑行 3.7 km</b></figcaption></figure>
  </div>

  <p class="line">海，是岛的<em>另一半。</em><small>FFT 实时海面 · 全部为游戏内实时渲染</small></p>

  <div class="stack">
    <figure class="frame full"><img src="/games/tide-echo/sea-sunpath.jpg" alt="开阔海面上的太阳光路" loading="lazy"><figcaption>SURFACE<b>海面</b></figcaption><span class="depth">0 m</span></figure>
    <div class="pair">
      <figure class="frame"><img src="/games/tide-echo/sea-clarity.jpg" alt="从反光到通透的海水" loading="lazy"><figcaption>CLARITY<b>通透</b></figcaption></figure>
      <figure class="frame"><img src="/games/tide-echo/shallows.jpg" alt="浅滩沙底的焦散光纹与浪花" loading="lazy"><figcaption>SHALLOWS<b>浅滩</b></figcaption><span class="depth">1 m</span></figure>

  </div>

  <div class="waterline" aria-hidden="true"></div>

  <div class="stack" style="background:var(--abyss)">
    <figure class="frame full"><img src="/games/tide-echo/surface-from-below.jpg" alt="从水下仰望起伏的海面" loading="lazy"><figcaption>BELOW<b>水下</b></figcaption><span class="depth">−6 m</span></figure>
    <div class="pair">
      <figure class="frame"><img src="/games/tide-echo/underwater-reef.jpg" alt="光柱、鱼群与珊瑚礁" loading="lazy"><figcaption>REEF<b>礁盘</b></figcaption><span class="depth">−10 m</span></figure>
      <figure class="frame"><img src="/games/tide-echo/reef-close.jpg" alt="海底的珊瑚、鱼与海龟" loading="lazy"><figcaption>SEABED<b>海底</b></figcaption><span class="depth">−12 m</span></figure>
    </div>
  </div>

  <div class="verbs" aria-label="核心玩法">
    <div>海钓<small>FISH</small></div><div>潜水<small>DIVE</small></div><div>义工<small>WORK</small></div><div>骑行<small>RIDE</small></div>
  </div>

  <section class="reel" aria-label="海钓小游戏">
    <h2><small>TRY IT</small>收一条鱼</h2>
    <div class="reel-stage">
      <div class="water" aria-hidden="true"><span class="bobber"></span><span class="fish"></span></div>

      <div class="bar line-bar" role="meter" aria-label="剩余线长" aria-valuemin="0" aria-valuemax="100" aria-valuenow="100"><span class="fill line-fill"></span></div>
      <div class="reel-controls"><button class="reel-btn" type="button">按住收线</button><button class="reel-btn secondary restart" type="button">重来</button></div>

<script>
// Pictures settle into place as they scroll into view.
(() => {
  const frames = document.querySelectorAll('.frame');
  if (!('IntersectionObserver' in window)) { frames.forEach(frame => frame.classList.add('seen')); return; }
  const observer = new IntersectionObserver(entries => entries.forEach(entry => {
    if (entry.isIntersecting) { entry.target.classList.add('seen'); observer.unobserve(entry.target); }
  }), { threshold: .2 });
  frames.forEach(frame => observer.observe(frame));
})();

// Fishing toy: a simplified version of the in-game line tension.
(() => {
  const stage = document.querySelector('.reel-stage');
  const button = stage.querySelector('.reel-btn:not(.secondary)');
  const restart = stage.querySelector('.restart');
  const status = stage.querySelector('.reel-status');
  const tensionFill = stage.querySelector('.tension-fill');
  const lineFill = stage.querySelector('.line-fill');
  const tensionBar = tensionFill.parentElement, lineBar = lineFill.parentElement;
  let tension, line, slack, strain, stamina, holding, done, started, last, frame, time;

  const reset = () => {
    tension = 30; line = 100; slack = 0; strain = 0; stamina = 1; holding = false; done = false; started = false; time = 0;
    status.textContent = '张力留在绿区里。';
    button.disabled = false;
    cancelAnimationFrame(frame); last = performance.now(); frame = requestAnimationFrame(step);
  };
  const finish = message => { done = true; holding = false; button.classList.remove('held'); button.disabled = true; status.textContent = message; };

  function step(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; time += dt;
    if (!done && started) {
      const surge = Math.max(0, Math.sin(time * 1.7) * Math.sin(time * .63)) * 55 * stamina;
      tension = Math.max(0, Math.min(100, tension + ((holding ? 46 : -38) + surge) * dt));
      const inZone = tension >= 25 && tension <= 75;
      line = holding ? line - (inZone ? 24 : 9) * dt : Math.min(100, line + 1.5 * dt);
      stamina = Math.max(.35, stamina - .03 * dt);
      strain = tension > 92 ? strain + dt : Math.max(0, strain - dt * 2);
      slack = tension < 8 ? slack + dt : 0;
      if (strain > .9) finish('线断了。');
      else if (slack > 2.2) finish('鱼脱钩了。');
      else if (line <= 0) { line = 0; finish('钓上来了！'); }
      else status.textContent = tension > 80 ? '太紧了！' : tension < 15 ? '太松了！' : holding ? '收线中……' : '张力留在绿区里。';
    }
    tensionFill.style.width = tension + '%';
    tensionFill.classList.toggle('warn', tension > 75 || tension < 15);
    tensionFill.classList.toggle('danger', tension > 90);
    lineFill.style.width = line + '%';
    tensionBar.setAttribute('aria-valuenow', Math.round(tension));
    lineBar.setAttribute('aria-valuenow', Math.round(line));
    stage.style.setProperty('--line-left', 12 + line * .78);
    stage.style.setProperty('--bob', (Math.sin(time * 4) * 3 + (tension > 60 ? 6 : 0)) + 'px');
    if (!done) frame = requestAnimationFrame(step);
  }

  const hold = value => { if (done) return; if (value) started = true; holding = value; button.classList.toggle('held', value); };
  button.addEventListener('pointerdown', event => { event.preventDefault(); button.setPointerCapture(event.pointerId); hold(true); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(type => button.addEventListener(type, () => hold(false)));
  button.addEventListener('keydown', event => { if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) { event.preventDefault(); hold(true); } });
  button.addEventListener('keyup', event => { if (event.key === ' ' || event.key === 'Enter') hold(false); });
  restart.addEventListener('click', () => { reset(); button.focus(); });
  reset();
})();
</script>
