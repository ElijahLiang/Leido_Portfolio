<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1240" />
      <stop offset="55%" stop-color="#3b1f6b" />
      <stop offset="100%" stop-color="#0c2540" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4facfe" stop-opacity="0" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f093fb" stop-opacity="0" />
      <stop offset="50%" stop-color="#f093fb" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#f5576c" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" />
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)" />
  <circle cx="400" cy="300" r="320" fill="url(#glow)" />

  <g opacity="0.35" stroke="#a5b4fc" stroke-width="1" fill="none">
    <line x1="0" y1="120" x2="800" y2="120" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="360" x2="800" y2="360" />
    <line x1="0" y1="480" x2="800" y2="480" />
  </g>

  <g filter="url(#soft)">
    <path d="M0 300 Q 100 200, 200 300 T 400 300 T 600 300 T 800 300"
          stroke="url(#wave1)" stroke-width="6" fill="none" />
    <path d="M0 320 Q 100 420, 200 320 T 400 320 T 600 320 T 800 320"
          stroke="url(#wave2)" stroke-width="4" fill="none" opacity="0.85" />
  </g>

  <g fill="#818cf8" opacity="0.9">
    <circle cx="160" cy="180" r="6" />
    <circle cx="640" cy="180" r="6" />
    <circle cx="120" cy="440" r="5" />
    <circle cx="680" cy="440" r="5" />
    <circle cx="400" cy="120" r="4" />
    <circle cx="400" cy="480" r="4" />
  </g>

  <g transform="translate(400 300)" text-anchor="middle"
     font-family="'Segoe UI', system-ui, sans-serif" fill="#ffffff">
    <text y="-12" font-size="58" font-weight="800" letter-spacing="6">z°o¶</text>
    <text y="44" font-size="22" letter-spacing="14" fill="#cbd5e1" font-weight="500">RHYTHM × COMBAT</text>
    <text y="84" font-size="16" letter-spacing="3" fill="#94a3b8">Music Rhythm Game Demo</text>
  </g>
</svg>
