[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# SPA fallback: 把所有未匹配的路径回退到 index.html，
# 这样刷新子路由不会 404。
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# 长期缓存带 hash 的静态资源，加快回访速度
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
